services:
  wanz-prase2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xijuan
    image: wanz-prase2-001:latest
    restart: always
    network_mode: host
    volumes:
      # 使用宿主机最新代码；依赖保留在镜像 /opt/venv 中，更新代码后重启即可
      - .:/app:ro
      # 挂载整个配置目录，使设置页面可通过原子替换持久化配置
      - ./configs:/app/configs
      # 挂载日志目录，持久化日志
      - ./logs:/app/logs
      # 挂载 PDF 原始目录，持久化上传的 PDF（VL 抽取 / PDF 预览依赖，务必持久化，否则容器重建即丢）
      - ./uploads:/app/uploads
      # 挂载数据目录（预留，当前代码未写入此目录）
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5019/docs', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
